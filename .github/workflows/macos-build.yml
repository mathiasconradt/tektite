name: macOS Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tektite for macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix private registry URLs in lockfile
        run: sed -i '' 's|https://repox.jfrog.io/artifactory/api/npm/npm/|https://registry.npmjs.org/|g' package-lock.json 2>/dev/null || sed -i 's|https://repox.jfrog.io/artifactory/api/npm/npm/|https://registry.npmjs.org/|g' package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run postinstall
        run: node scripts/postinstall.js

      - name: Syntax check
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer/renderer.js
          node --check scripts/start.js

      - name: Package macOS app
        run: npm exec -- electron-packager . Tektite --platform=darwin --arch=arm64,x64 --icon=assets/icons/tektite-icon.icns --overwrite --no-asar

      - name: Create Homebrew cask zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent Tektite-darwin-arm64/Tektite.app Tektite-macOS-arm64.zip
          ditto -c -k --sequesterRsrc --keepParent Tektite-darwin-x64/Tektite.app Tektite-macOS-x64.zip

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tektite-macOS
          path: |
            Tektite-macOS-arm64.zip
            Tektite-macOS-x64.zip

      - name: Create tag and release on main push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists, skipping tag creation"
          else
            git tag "${tag}"
            git push origin "${tag}"
          fi
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Publish GitHub release asset (main push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor != 'github-actions[bot]'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Tektite ${{ env.RELEASE_TAG }}
          files: |
            Tektite-macOS-arm64.zip
            Tektite-macOS-x64.zip

      - name: Publish GitHub release asset (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            Tektite-macOS-arm64.zip
            Tektite-macOS-x64.zip
